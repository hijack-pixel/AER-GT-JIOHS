[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aergt"
version = "0.1.0"
description = "Reproducibility code for AER-GT IOS decoding in epilepsy."
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.10",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "PyYAML>=6.0",
  "joblib>=1.4",
  "torch>=2.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"
